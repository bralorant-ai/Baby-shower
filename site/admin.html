<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de organizadores</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin">
<main class="wrap">
  <h1>Panel de organizadores</h1>
  <section id="login" class="panel">
    <form id="lf">
      <label>Correo<input type="email" id="em" required autocomplete="username"></label>
      <label>Contraseña<input type="password" id="pw" required autocomplete="current-password"></label>
      <p id="lerr" class="err" role="alert" hidden></p>
      <button class="btn">Entrar</button>
    </form>
    <p><a href="index.html">← Volver a la lista</a></p>
  </section>
  <section id="dash" hidden>
    <div class="row between">
      <div class="chips"><button class="chip on" data-tab="gifts">Regalos</button><button class="chip" data-tab="res">Reservas</button></div>
      <button id="out" class="btn ghost">Salir</button>
    </div>
    <div id="stats" class="stats"></div>
    <div id="tab-gifts"><button id="add" class="btn">+ Agregar regalo</button><div id="glist"></div></div>
    <div id="tab-res" hidden><div id="rlist"></div></div>
  </section>
</main>
<dialog id="gd">
  <h2 id="gdTitle">Regalo</h2>
  <form id="gf">
    <label>Nombre<input id="f-name" required maxlength="120"></label>
    <label>Categoría<select id="f-cat"></select></label>
    <label>Precio aproximado (COP)<input id="f-price" type="number" min="0" step="1000" inputmode="numeric"></label>
    <label>Descripción<textarea id="f-desc" rows="2" maxlength="300"></textarea></label>
    <label>URL de imagen (opcional)<input id="f-img" type="url"></label>
    <p id="gerr" class="err" role="alert" hidden></p>
    <div class="row"><button type="button" class="btn ghost" id="gcancel">Cancelar</button><button class="btn">Guardar</button></div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
